[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixiv-novel-sync"
version = "0.1.0"
description = "Self-hosted Pixiv novel library: incremental sync, local archive and search, mobile reading, EPUB export, rule-based recommendations and rescue reading"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "dong-jpg" }
]
dependencies = [
  "pixivpy3>=3.7.5",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.2",
  "requests>=2.32.3",
  "urllib3>=2.0,<3",
  "cryptography>=42",
  "Flask>=3.0.3",
  "waitress>=3.0.0",
  "playwright>=1.48.0",
  "croniter>=2.0.0",
  "ebooklib>=0.18",
]

[project.urls]
Homepage = "https://github.com/dong-jpg/pixiv-novel-sync"
Issues = "https://github.com/dong-jpg/pixiv-novel-sync/issues"
Documentation = "https://github.com/dong-jpg/pixiv-novel-sync/blob/main/docs/INDEX.md"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
pixiv-novel-sync = "pixiv_novel_sync.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
pixiv_novel_sync = ["templates/*.html", "static/css/*.css"]
