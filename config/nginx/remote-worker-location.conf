# Add this zone ONCE in the nginx http {} context, before including locations:
# limit_req_zone $binary_remote_addr zone=pixiv_remote_sessions:1m rate=6r/m;
# Locations below belong inside the HTTPS server {} block. Verify upstream port.

location = /api/remote-worker/v1/sessions {
    limit_req zone=pixiv_remote_sessions burst=3 nodelay;
    limit_req_status 429;
    error_page 429 = @pixiv_remote_session_limited;
    client_max_body_size 16k;
    client_body_timeout 60s;
    proxy_pass http://127.0.0.1:5011;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_cache off;
}

location @pixiv_remote_session_limited {
    default_type application/json;
    add_header Retry-After 10 always;
    add_header Cache-Control "private, no-store" always;
    return 429 '{"error":"rate_limited"}';
}

location ^~ /api/remote-worker/v1/ {
    client_max_body_size 33m;
    client_body_timeout 60s;
    proxy_pass http://127.0.0.1:5011;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_cache off;
}
