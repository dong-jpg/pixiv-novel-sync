<script>
  // Pixiv 正文标记 → 阅读页 HTML。解析规则与 src/pixiv_novel_sync/pixiv_markup.py 逐条对应、
  // 产出同一棵树（tests/fixtures/pixiv_markup_cases.json 同时校验两边），改规则要两边一起改。
  // 渲染只产出白名单标签，每段文字、每个属性值都过 escapeHtml：正文里的 <script> 只会是字面文字；
  // jumpuri 只放行 http(s)。所有扫描都是线性的，不用 /\s+$/ 一类会回溯的正则——正文是作者可控的输入。
  (() => {
    const MAX_BLANK_LINES = 3;
    const MAX_INLINE_DEPTH = 8;
    // 与 Python 版 WHITESPACE 同一串（= String.prototype.trim() 去掉的空白，不含换行）
    const WHITESPACE = new Set('\t\x0b\x0c \xa0\u1680\u2000\u2001\u2002\u2003\u2004\u2005\u2006\u2007\u2008\u2009\u200a\u2028\u2029\u202f\u205f\u3000\ufeff');
    const BRACKET_RE = /[\[\]]/g;
    const PAIR_SPLIT_RE = /[\[\]>]/g;
    const BLOCK_RE = /\[(chapter|pixivimage|uploadedimage):/g;
    const JUMP_RE = /\[jump:([0-9]{1,9})\]/y;
    const DOUBLE_RE = /\[\[(rb|jumpuri|emphasismark):/y;
    const SINGLE_RE = /\[(b|i):/y;
    const SAFE_URL_RE = /^https?:\/\/[^\x00-\x20\x7f-\x9f\xa0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000\ufeff"'<>`\\]+$/i;
    const SESAME_MARKS = ['\ufe45', '\u3001'];  // 芝麻点：﹅ 与 、

    const trimStartWs = (s) => { let i = 0; while (i < s.length && WHITESPACE.has(s[i])) i += 1; return s.slice(i); };
    const trimEndWs = (s) => { let i = s.length; while (i > 0 && WHITESPACE.has(s[i - 1])) i -= 1; return s.slice(0, i); };
    const trimWs = (s) => trimStartWs(trimEndWs(s));
    const trimEndSpaceTab = (s) => { let i = s.length; while (i > 0 && (s[i - 1] === ' ' || s[i - 1] === '\t')) i -= 1; return s.slice(0, i); };
    const stripNewlines = (s) => {
      let start = 0;
      let end = s.length;
      while (start < end && s[start] === '\n') start += 1;
      while (end > start && s[end - 1] === '\n') end -= 1;
      return s.slice(start, end);
    };
    const isBlankPage = (s) => {
      for (let i = 0; i < s.length; i += 1) if (s[i] !== '\n' && !WHITESPACE.has(s[i])) return false;
      return true;
    };
    const isSafeUrl = (url) => typeof url === 'string' && SAFE_URL_RE.test(url);
    const pixivArtworkId = (id) => {
      const head = String(id || '').split('-', 1)[0];
      return /^[0-9]+$/.test(head) ? head : null;
    };

    // 一次扫描配好所有方括号：开括号下标 → 闭括号下标，配不上的不在表里
    const pairBrackets = (text) => {
      const pairs = new Map();
      const stack = [];
      for (const m of text.matchAll(BRACKET_RE)) {
        if (m[0] === '[') stack.push(m.index);
        else if (stack.length) pairs.set(stack.pop(), m.index);
      }
      return pairs;
    };

    const splitPages = (text) => {
      const normalized = String(text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      const pages = normalized.split('[newpage]').map(stripNewlines);
      // 只丢末尾的空页：中间的空页要留着，否则 [jump:N] 的页码会错位
      while (pages.length > 1 && isBlankPage(pages[pages.length - 1])) pages.pop();
      return pages;
    };

    const parsePage = (page) => {
      const blocks = [];
      let blankRun = 0;
      for (const line of page.split('\n')) {
        if (!trimWs(line)) {
          blankRun += 1;
          if (blankRun <= MAX_BLANK_LINES) blocks.push({ type: 'blank' });
          continue;
        }
        blankRun = 0;
        parseLine(line, blocks);
      }
      while (blocks.length && blocks[0].type === 'blank') blocks.shift();
      while (blocks.length && blocks[blocks.length - 1].type === 'blank') blocks.pop();
      return blocks;
    };

    const parseLine = (line, blocks) => {
      const pairs = pairBrackets(line);
      let last = 0;
      for (const match of line.matchAll(BLOCK_RE)) {
        const start = match.index;
        const close = pairs.get(start);
        if (start < last || close === undefined) continue;
        const kind = match[1];
        const bodyStart = start + match[0].length;
        // 插图 ID 里不许再有方括号；只需找「[」：没有「[」时第一个「]」必然就是 close
        const nested = line.indexOf('[', bodyStart);
        if (kind !== 'chapter' && nested !== -1 && nested < close) continue;
        pushParagraph(blocks, line.slice(last, start), last === 0);
        const body = trimWs(line.slice(bodyStart, close));
        if (kind === 'chapter') blocks.push({ type: 'chapter', content: parseInline(body, 0) });
        else blocks.push({ type: 'image', kind, id: body });
        last = close + 1;
      }
      pushParagraph(blocks, line.slice(last), last === 0);
    };

    const pushParagraph = (blocks, segment, first) => {
      const body = trimWs(segment);
      if (!body) return;
      const indent = first ? segment.slice(0, segment.length - trimStartWs(segment).length) : '';
      blocks.push({ type: 'paragraph', indent, content: parseInline(body, 0) });
    };

    const parseInline = (text, depth) => {
      if (!text) return [];
      if (depth >= MAX_INLINE_DEPTH) return [text];
      const pairs = pairBrackets(text);
      const nodes = [];
      let buffer = '';
      let i = 0;
      while (i < text.length) {
        const open = text.indexOf('[', i);
        if (open < 0) {
          buffer += text.slice(i);
          break;
        }
        buffer += text.slice(i, open);
        const token = matchToken(text, open, pairs, depth);
        if (!token) {
          buffer += '[';
          i = open + 1;
          continue;
        }
        if (buffer) nodes.push(buffer);
        buffer = '';
        nodes.push(token.node);
        i = token.end;
      }
      if (buffer) nodes.push(buffer);
      return nodes;
    };

    const matchToken = (text, start, pairs, depth) => {
      JUMP_RE.lastIndex = start;
      let m = JUMP_RE.exec(text);
      if (m) return { node: { type: 'jump', page: Number(m[1]) }, end: start + m[0].length };
      DOUBLE_RE.lastIndex = start;
      m = DOUBLE_RE.exec(text);
      if (m) {
        const close = pairs.get(start);
        // [[kind:BODY]]：外层 [ 配最后一个 ]，内层 [ 配倒数第二个 ]
        if (close === undefined || pairs.get(start + 1) !== close - 1) return null;
        return { node: doubleNode(m[1], text.slice(start + m[0].length, close - 1), depth), end: close + 1 };
      }
      SINGLE_RE.lastIndex = start;
      m = SINGLE_RE.exec(text);
      if (m) {
        const close = pairs.get(start);
        if (close === undefined) return null;
        const content = parseInline(text.slice(start + m[0].length, close), depth + 1);
        return { node: { type: m[1] === 'b' ? 'bold' : 'italic', content }, end: close + 1 };
      }
      return null;
    };

    const doubleNode = (kind, body, depth) => {
      if (kind === 'rb') {
        const [base, rt] = splitPair(body, false);
        return { type: 'ruby', base, rt };
      }
      if (kind === 'jumpuri') {
        const [label, url] = splitPair(body, true);
        return { type: 'link', href: isSafeUrl(url) ? url : null, content: parseInline(label, depth + 1) };
      }
      const [label, mark] = splitPair(body, false);
      const style = SESAME_MARKS.some(ch => mark.includes(ch)) ? 'sesame' : 'dot';
      return { type: 'emphasis', style, content: parseInline(label, depth + 1) };
    };

    // 按不在嵌套方括号里的「>」拆成两半；左半去尾部空格，右半两头去空白
    const splitPair = (body, useLast) => {
      let at = -1;
      let level = 0;
      for (const m of body.matchAll(PAIR_SPLIT_RE)) {
        if (m[0] === '[') level += 1;
        else if (m[0] === ']') level -= 1;
        else if (level === 0) {
          at = m.index;
          if (!useLast) break;
        }
      }
      if (at < 0) return [body, ''];
      return [trimEndSpaceTab(body.slice(0, at)), trimWs(body.slice(at + 1))];
    };

    const parse = (text) => splitPages(text).map(parsePage);

    const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, ch => ESCAPES[ch]);

    // 链接里不能再套链接：嵌套的 jumpuri / jump 只留文字
    const renderInline = (nodes, pageCount, inLink) => nodes.map((node) => {
      if (typeof node === 'string') return escapeHtml(node);
      const inner = () => renderInline(node.content, pageCount, inLink);
      switch (node.type) {
        case 'ruby':
          if (!node.rt) return escapeHtml(node.base);
          return `<ruby>${escapeHtml(node.base)}<rp>(</rp><rt>${escapeHtml(node.rt)}</rt><rp>)</rp></ruby>`;
        case 'link': {
          const label = renderInline(node.content, pageCount, true);
          if (inLink || !isSafeUrl(node.href)) return label;
          return `<a class="pns-link" href="${escapeHtml(node.href)}" target="_blank" rel="noopener noreferrer nofollow">${label}</a>`;
        }
        case 'jump': {
          const label = escapeHtml(`跳到第 ${node.page} 页`);
          if (inLink) return label;
          if (node.page < 1 || node.page > pageCount) return `<span class="pns-jump-disabled">${label}</span>`;
          return `<a class="pns-link" href="#pns-page-${node.page}" data-pns-page="${node.page}">${label}</a>`;
        }
        case 'bold':
          return `<b>${inner()}</b>`;
        case 'italic':
          return `<i>${inner()}</i>`;
        case 'emphasis':
          return `<span class="pns-emphasis${node.style === 'sesame' ? ' pns-emphasis-sesame' : ''}">${inner()}</span>`;
        default:
          return '';
      }
    }).join('');

    // 备份没有存「插图 ID → 图片文件」的对应关系，如实给占位，不猜图
    const renderImage = (block) => {
      const note = '此处原有插图（私人备份未收录插图）';
      const artwork = block.kind === 'pixivimage' ? pixivArtworkId(block.id) : null;
      if (!artwork) return `<div class="pns-image-missing">${note}</div>`;
      const href = escapeHtml('https://www.pixiv.net/artworks/' + artwork);
      return `<div class="pns-image-missing">${note} <a class="pns-link" href="${href}" target="_blank" rel="noopener noreferrer">到 Pixiv 查看作品</a></div>`;
    };

    // 段落仍是「一行一个 <p>、空行一个 empty-line」，缩进交给 .reader-body p 的 text-indent
    const renderBlock = (block, pageCount) => {
      switch (block.type) {
        case 'paragraph':
          return `<p>${renderInline(block.content, pageCount, false)}</p>`;
        case 'blank':
          return '<p class="empty-line"></p>';
        case 'chapter':
          return `<h2 class="pns-chapter">${renderInline(block.content, pageCount, false)}</h2>`;
        case 'image':
          return renderImage(block);
        default:
          return '';
      }
    };

    // 阅读页是整篇连续滚动（进度按滚动位置算），[newpage] 画成分隔条，不拆成翻页
    const renderHtml = (text) => {
      const pages = parse(text);
      const total = pages.length;
      const parts = ['<div class="pns-page-anchor" id="pns-page-1" aria-hidden="true"></div>'];
      pages.forEach((blocks, index) => {
        if (index > 0) parts.push(`<div class="pns-page-break" id="pns-page-${index + 1}">${index + 1} / ${total} 页</div>`);
        blocks.forEach(block => parts.push(renderBlock(block, total)));
      });
      return parts.join('\n');
    };

    window.pixivMarkup = { parse, renderHtml, isSafeUrl };
  })();
</script>
